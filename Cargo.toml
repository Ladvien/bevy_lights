[package]
name = "bevy_lights"
version = "0.2.14"
edition = "2024"
rust-version = "1.97.1"
description = "Practical lights for Bevy: fires that flicker and flare as they kindle, a budgeted pool of real lights placed over thousands of virtual ones, and billboard shader flames."
license = "MIT OR Apache-2.0"
authors = ["C. Thomas Brittain <cthomasbrittain@yahoo.com>"]
repository = "https://github.com/Ladvien/bevy_lights"
documentation = "https://docs.rs/bevy_lights"
readme = "README.md"
keywords = ["bevy", "lighting", "fire", "gamedev", "rendering"]
categories = ["game-development", "graphics", "rendering"]
# Everything a consumer needs and nothing else. `docs/` is research notes and captures and never ships;
# the patterns are anchored, because an unanchored `README.md` also matches `docs/research/README.md`.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[features]
default = []
# `serde` derives on every public component and resource, and Bevy's own `serialize` for `Color`,
# `LinearRgba` and the light components those types are built from.
serde = ["dep:serde", "bevy/serialize"]
# Nothing enables this in normal use. `tests/readme.rs` turns it on for one `cargo build --example` to
# compile the README's quick start, so a field added to a component cannot leave the README stale.
readme-example = []

[dependencies]
# The engine, trimmed to the features the crate's code names. The list is the minimum for which
# `cargo build` passes: the full `bevy` dev-dependency hides a hole in it, so CI runs a plain
# `cargo build` (no dev-dependencies) as its first step.
bevy = { version = "0.20.0", default-features = false, features = [
    "std",              # `Vec`, `String` and the std-only error types the systems use
    "bevy_log",         # `warn_once!` and `error!` from `finish()`
    "bevy_asset",       # `Handle`, `Assets`, and `embedded_asset!` for the flame shader
    "bevy_render",      # the render app `MaterialPlugin` and `embedded_asset!` live in
    "bevy_core_pipeline", # the `Core3d` schedules a material's pass is added to
    "bevy_pbr",         # `Material`, `MaterialPlugin`, `MeshMaterial3d`
    "bevy_light",       # `PointLight`, `SpotLight`
    "bevy_mesh",        # `Mesh`, `MeshTag`, `Mesh3d`, `Rectangle`
    "bevy_camera",      # `ViewVisibility`, `NoFrustumCulling`
    "bevy_shader",      # `ShaderRef`
] }                     # https://github.com/bevyengine/bevy — the engine
serde = { version = "1", features = ["derive"], optional = true } # https://github.com/serde-rs/serde — the optional derives

[[example]]
name = "courtyard"
path = "examples/courtyard.rs"

[[example]]
name = "bench_lights"
path = "examples/bench_lights.rs"

# The README's quick start, compiled by `tests/readme.rs`. It is behind a feature nothing enables, so
# `cargo build --examples` and the published package never see it; the test turns the feature on for one
# `cargo build --example` call. `tests/readme.rs` writes the file from the README before that build.
[[example]]
name = "readme_quick_start"
path = "examples/readme_quick_start.rs"
required-features = ["readme-example"]

[dev-dependencies]
bevy = { version = "0.20.0" } # full umbrella, examples and tests only
serde_json = "1" # https://github.com/serde-rs/json — the serde tests' wire format

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"

[package.metadata.docs.rs]
all-features = true

[profile.dev.package."*"]
opt-level = 3
